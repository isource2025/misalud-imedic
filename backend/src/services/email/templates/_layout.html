<!doctype html>
<html lang="es-AR" xml:lang="es-AR" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Language" content="es-AR" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{asunto}}" />
    <title>{{asunto}} · {{marca}}</title>
  </head>
  <body lang="es-AR" style="margin:0;padding:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{asunto}}. Mensaje de {{marca}}, el portal del paciente de las clínicas iMedic.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fb;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06);">
            <tr>
              <td style="padding:28px 32px 8px 32px;">
                <span style="display:inline-block;width:32px;height:32px;border-radius:10px;background:#2563eb;vertical-align:middle;"></span>
                <span style="font-size:18px;font-weight:700;letter-spacing:-.01em;vertical-align:middle;margin-left:8px;">{{marca}}</span>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 32px 32px;font-size:16px;line-height:1.6;">%%CONTENIDO%%</td>
            </tr>
            <tr>
              <td style="padding:20px 32px;background:#f8fafc;color:#64748b;font-size:12px;line-height:1.5;">
                Este es un mensaje automático, no lo respondas. &copy; {{anio}} {{marca}} · iMedic
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
